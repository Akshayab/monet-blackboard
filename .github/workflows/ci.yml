name: CI
on:
  pull_request:
  # Pull requests are covered above; pushes run only on the long-lived branches, so a PR branch isn't tested twice.
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  build:
    name: Format, typecheck, test, audit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --prod
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (scripted model)
    # Playwright installs browser dependencies only on the Ubuntu releases it supports.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: monet
          POSTGRES_PASSWORD: monet
          POSTGRES_DB: monet
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U monet" --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DATABASE_URL: postgres://monet:monet@localhost:5432/monet
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "24", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @monet/scripts exec playwright install --with-deps chromium
      - name: Team mode
        run: |
          TEAM_MODE=1 OWNER_LINK_TOKEN=e2e-owner-token NODE_ENV=development AI_MOCK=1 PORT=3000 \
            node apps/server/dist/index.mjs > server-team.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/healthz && break; sleep 1; done
          pnpm test:e2e
          kill $SERVER_PID
      - name: Solo mode
        run: |
          NODE_ENV=development AI_MOCK=1 PORT=3001 node apps/server/dist/index.mjs > server-solo.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3001/api/healthz && break; sleep 1; done
          E2E_BASE_URL=http://localhost:3001 pnpm --filter @monet/scripts run e2e solo.spec.ts boards.spec.ts canvas.spec.ts
      - name: Security checks
        run: |
          TEAM_MODE=1 OWNER_LINK_TOKEN=sec-owner-token NODE_ENV=development AI_MOCK=1 PORT=8099 \
            RATE_AUTH_PER_IP_PER_MIN=40 RATE_AI_REQUESTS_PER_MIN=4 WS_REVALIDATE_MS=2000 \
            node apps/server/dist/index.mjs > server-security.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8099/api/healthz && break; sleep 1; done
          BASE_URL=http://localhost:8099 OWNER_LINK_TOKEN=sec-owner-token node scripts/e2e/security-api.mjs
      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            scripts/e2e/.report
            server-*.log
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Secret scan
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks_8.28.0_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks
          ./gitleaks git --redact --no-banner .

  docker:
    name: Docker quick start (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start with Docker Compose, as in the README
        run: |
          cp .env.example .env
          sed -i "s/^ANTHROPIC_API_KEY=.*/ANTHROPIC_API_KEY=sk-ci-placeholder/" .env
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:3000/api/healthz && break; sleep 2; done
          curl -fs http://127.0.0.1:3000/api/healthz
          curl -fs -o /dev/null http://127.0.0.1:3000/
          curl -fs -o /dev/null http://127.0.0.1:3000/fonts/Virgil/Virgil-Regular.woff2
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: attacker.example' http://127.0.0.1:3000/api/boards)" = 403
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -100
