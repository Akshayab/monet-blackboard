<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Page zoom stays on for accessibility; the board page turns it off while open (the canvas owns pinch). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Share-link tokens live in board URLs: only send the origin to other sites. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Monet Blackboard: the whiteboard that thinks with you</title>
    <meta
      name="description"
      content="Monet Blackboard is an infinite whiteboard where you and an AI collaborator brainstorm together. Dump a messy plan and watch it become editable stickies, sections, flows, and timelines."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171717" />
    <meta name="application-name" content="Monet Blackboard" />
    <meta name="apple-mobile-web-app-title" content="Monet Blackboard" />
    <meta property="og:site_name" content="Monet Blackboard" />
    <meta property="og:title" content="Monet Blackboard: the whiteboard that thinks with you" />
    <meta property="og:description" content="A shared canvas where people and an AI collaborator turn messy plans into editable boards, live." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A messy note turning into an organized board with sections, sticky notes, and a timeline." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Monet Blackboard: the whiteboard that thinks with you" />
    <meta name="twitter:description" content="A shared canvas where people and an AI collaborator turn messy plans into editable boards, live." />
    <meta name="twitter:image" content="/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
